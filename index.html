<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dedbd7">
  <meta name="description" content="VALMONT 스파 메뉴와 제품별 음악을 확인하세요.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="발몽 메뉴">
  <meta property="og:description" content="VALMONT 스파 메뉴와 제품별 음악을 확인하세요.">
  <title>발몽 메뉴</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="document" aria-label="VALMONT SPA BOOST 안내서">
    <section class="page" aria-label="표지">
      <img src="assets/valmont-page-1.webp" alt="VALMONT Exclusive Rituals 표지">
    </section>

    <section class="page" aria-label="트리트먼트 메뉴">
      <img src="assets/valmont-page-2.webp" alt="VALMONT 트리트먼트 메뉴">
    </section>

    <section class="page music-page" aria-label="SPA BOOST 음악 선택">
      <img src="assets/valmont-page-3.webp" alt="VALMONT SPA BOOST 리추얼과 음악 안내">

      <button class="hotspot" style="--x:27.42%; --tone:#a9c9ef" data-title="Hydration of Bisses" aria-label="하이드레이션 음악 재생" aria-pressed="false"></button>
      <button class="hotspot" style="--x:41.43%; --tone:#efd179" data-title="Vitality of the Glaciers" aria-label="바이탈리티 음악 재생" aria-pressed="false"></button>
      <button class="hotspot" style="--x:55.44%; --tone:#e5a0b2" data-title="Luminosity of Ice" aria-label="루미너시티 음악 재생" aria-pressed="false"></button>
      <button class="hotspot" style="--x:69.56%; --tone:#9fd4ac" data-title="Lift from the Peaks" aria-label="리프팅 음악 재생" aria-pressed="false"></button>
      <button class="hotspot" style="--x:83.57%; --tone:#aaa7dc" data-title="Firmness of the Hills" aria-label="펌니스 음악 재생" aria-pressed="false"></button>

      <audio preload="metadata" src="audio/01_Hydration_Bisses_15s_fade.mp3"></audio>
      <audio preload="metadata" src="audio/02_Vitality_Glaciers_15s_fade.mp3"></audio>
      <audio preload="metadata" src="audio/03_Luminosity_Ice_15s_fade.mp3"></audio>
      <audio preload="metadata" src="audio/04_Lifting_Peaks_15s_fade.mp3"></audio>
      <audio preload="metadata" src="audio/05_Firmness_Hills_15s_fade.mp3"></audio>
    </section>
  </main>

  <div class="player-status" role="status" aria-live="polite" hidden>
    <span class="status-dot"></span>
    <span class="status-text"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
